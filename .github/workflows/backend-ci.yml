name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    name: Lint and test backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prospect_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d prospect_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-secret-key
      DEBUG: "False"
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: prospect_tracker
      DB_USER: postgres
      DB_PASSWORD: postgres

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run lint
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest
